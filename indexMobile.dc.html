<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
<style>
  body{ margin:0; background:#E7DFC9; font-family:"Plus Jakarta Sans", system-ui, sans-serif; }
  .stage{ min-height:100vh; display:flex; flex-direction:column; align-items:center; gap:30px; padding:44px 24px 60px; }
  .cap{ text-align:center; color:#7A6863; }
  .cap b{ display:block; color:#463634; font-size:1.1rem; letter-spacing:-.01em; }
  .cap span{ font-size:.76rem; letter-spacing:.09em; text-transform:uppercase; }
  .row{ display:flex; flex-wrap:wrap; gap:44px; align-items:flex-start; justify-content:center; }
  .unit{ display:flex; flex-direction:column; align-items:center; gap:16px; }
  .phone{
    position:relative; width:414px; height:868px; flex:none;
    background:#1B1512; border-radius:56px; padding:12px;
    box-shadow:0 40px 90px -40px rgba(70,54,52,.6), 0 0 0 1px rgba(0,0,0,.25) inset;
  }
  .screen{
    position:relative; width:390px; height:844px; border-radius:44px; overflow:hidden; background:#FFF9E2;
  }
  .screen iframe{ width:390px; height:844px; border:0; display:block; }
  .notch{
    position:absolute; z-index:3; top:10px; left:50%; transform:translateX(-50%);
    width:112px; height:30px; background:#1B1512; border-radius:16px;
  }
  .bar{
    position:absolute; z-index:3; bottom:7px; left:50%; transform:translateX(-50%);
    width:132px; height:5px; border-radius:3px; background:rgba(70,54,52,.4);
  }
  .unit .cap span{ font-family:ui-monospace, Menlo, monospace; }
  .rule{ width:100%; max-width:1180px; height:1px; background:rgba(70,54,52,.18); margin:14px 0 0; }
  .vp{ flex:none; display:flex; flex-direction:column; align-items:center; gap:14px; }
  .vp-shell{
    background:#FFFDF7; border:1px solid rgba(70,54,52,.2); border-radius:14px;
    box-shadow:0 30px 70px -44px rgba(70,54,52,.55); overflow:hidden;
  }
  .vp-chrome{
    display:flex; align-items:center; gap:7px; padding:10px 14px;
    background:#F1E9D5; border-bottom:1px solid rgba(70,54,52,.14);
  }
  .vp-chrome i{ width:10px; height:10px; border-radius:50%; background:rgba(70,54,52,.26); }
  .vp-clip{ overflow:hidden; }
  .vp-clip iframe{ border:0; display:block; transform-origin:top left; }
</style>
</helmet>
<div class="stage">
  <div class="cap">
    <b>The One Properties — mobile</b>
    <span>390 × 844 · iPhone viewport</span>
  </div>
  <div class="row">
    <div class="unit">
      <div class="phone">
        <div class="screen">
          <span class="notch" aria-hidden="true"></span>
          <iframe src="./The One Properties v2.dc.html" title="The One Properties homepage on mobile"></iframe>
          <span class="bar" aria-hidden="true"></span>
        </div>
      </div>
      <div class="cap"><span>Home</span></div>
    </div>
    <div class="unit">
      <div class="phone">
        <div class="screen">
          <span class="notch" aria-hidden="true"></span>
          <iframe src="./The One Properties v2.dc.html#/santotomas" title="The One Santo Tomas property page on mobile"></iframe>
          <span class="bar" aria-hidden="true"></span>
        </div>
      </div>
      <div class="cap"><span>Property detail</span></div>
    </div>
  </div>

</div>

</x-dc>
</body>
</html>
